[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbd-dictionary-control"
version = "0.1.0"
description = "PDF belgelerindeki İngilizce bilişim terimlerini Türkçe sözlükle karşılaştıran yerel araç"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber>=0.10,<1",
]

[project.scripts]
tbd-dictionary-control = "terim_etmeni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["terim_etmeni*"]
